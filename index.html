<style>

#587080;line-height:1.6}.main{padding:34px clamp(18px,4vw,54px) 60px;min-width:0}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--teal);font-weight:800;margin-bottom:8px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:26px}.pagehead h1{font-size:clamp(25px,3vw,34px);margin:0 0 8px;color:var(--navy);letter-spacing:-.035em}.pagehead p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:23px;margin-bottom:20px}.card h2{font-size:17px;color:var(--navy);margin:0 0 7px}.subtext{font-size:13px;color:var(--muted);margin:0 0 19px;line-height:1.55}.grid{display:grid;gap:17px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label{font-size:12px;font-weight:750;color:#405867}.field input,.field select,.field textarea{width:100%;border:1px solid #cddbe2;border-radius:9px;background:#fff;padding:11px 12px;color:var(--ink);outline:none;min-width:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #246b9117}.field input:disabled,.field select:disabled{background:#f1f5f6;color:#93a1a9}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:750;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}.btn.primary{background:var(--navy);color:white}.btn.primary:hover{background:#24577a}.btn.secondary{background:#e8f2f4;color:var(--navy)}.btn.ghost{background:transparent;border:1px solid var(--line);color:#526978}.btn.danger{background:#fff0ef;color:var(--red)}.btn.success{background:#e8f6ef;color:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}.btnrow{display:flex;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat{padding:18px;border:1px solid var(--line);border-radius:14px;background:white}.stat .label{font-size:12px;color:var(--muted)}.stat strong{display:block;color:var(--navy);font-size:28px;margin-top:8px}.stat .detail{font-size:11px;color:#82939d;margin-top:4px}.stepper{display:flex;gap:8px;margin:22px 0 24px}.step{flex:1;display:flex;align-items:center;gap:9px;color:#8b9ca6;font-size:12px;font-weight:700;padding-bottom:12px;border-bottom:3px solid #e1e9ed}.step .num{width:25px;height:25px;border-radius:50%;background:#e8eef1;display:grid;place-items:center;font-size:11px}.step.active{color:var(--navy);border-color:var(--teal)}.step.active .num,.step.done .num{background:var(--navy);color:white}.step.done{color:var(--green);border-color:#b9dfd2}.choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.choice{border:1px solid var(--line);background:white;text-align:left;border-radius:12px;padding:16px;min-height:130px;color:var(--ink)}.choice:hover{border-color:#77b8bb}.choice.selected{border:2px solid var(--teal);background:#f0f9f8;padding:15px}.choice .choice-icon{width:38px;height:38px;border-radius:10px;background:#e8f3f5;display:grid;place-items:center;font-size:20px;margin-bottom:12px}.choice strong{display:block;font-size:13px;color:var(--navy);margin-bottom:5px}.choice small{color:var(--muted);font-size:11px;line-height:1.45;display:block}.doctor-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.doctor{border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}.doctor.selected{border:2px solid var(--teal);background:#f0f9f8;padding:14px}.docavatar{width:46px;height:46px;border-radius:13px;background:#e8eef7;display:grid;place-items:center;color:var(--navy);font-weight:800;flex-shrink:0}.doctor strong{display:block;font-size:13px;color:var(--navy);margin:2px 0 5px}.doctor small{display:block;color:var(--muted);font-size:11px;line-height:1.5}.dates{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 18px}.datebtn{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:white;min-width:82px;text-align:center;color:var(--ink)}.datebtn small{display:block;color:var(--muted);font-size:10px}.datebtn strong{display:block;font-size:13px;margin-top:4px}.datebtn.selected{background:#e8f5f3;border:2px solid var(--teal);padding:9px 11px}.times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.timebtn{border:1px solid var(--line);border-radius:8px;padding:11px;background:white;color:#3f5868;font-size:12px}.timebtn.selected{border:2px solid var(--teal);background:#e8f5f3;color:var(--navy);font-weight:800;padding:10px}.timebtn:disabled{background:#f0f3f4;color:#aeb8bd;text-decoration:line-through;cursor:not-allowed}.summary{background:#f4f8fa;border-radius:12px;padding:16px;margin:18px 0;font-size:13px;line-height:1.9}.summary strong{color:var(--navy)}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#7b8e99;font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:12px;border-bottom:1px solid var(--line)}td{padding:14px 12px;border-bottom:1px solid #edf1f3;vertical-align:middle}td strong{color:var(--navy)}.status{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:800}.status.pending{background:#fff4d8;color:#91680b}.status.approved{background:#e4f6ed;color:#20724e}.status.rejected{background:#fde9e8;color:#a33b3b}.status.read{background:#edf2f5;color:#6c7c86}.notice{padding:13px 15px;border-radius:10px;font-size:13px;line-height:1.5;margin:12px 0}.notice.info{background:#eaf4f8;color:#275b78}.notice.error{background:#fff0ef;color:#9f3434}.notice.success{background:#e8f6ef;color:#236d50}.notice.warn{background:#fff5df;color:#876314}.empty{text-align:center;padding:35px 15px;color:var(--muted);font-size:13px}.empty .symbol{font-size:28px;margin-bottom:8px}.login-wrap{max-width:490px;margin:4vh auto}.login-brand{justify-content:center;margin-bottom:27px}.login-card{padding:30px}.login-card h1{font-size:27px;color:var(--navy);margin:0 0 8px}.login-card>p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 24px}.linkbtn{border:0;background:transparent;color:var(--blue);font-weight:750;padding:8px 0;font-size:12px}.divider{height:1px;background:var(--line);margin:19px 0}.tiny{font-size:11px;color:var(--muted);line-height:1.6}.toast{position:fixed;right:20px;bottom:20px;z-index:10;background:var(--navy);color:white;border-radius:12px;padding:14px 18px;box-shadow:0 10px 30px #0002;max-width:360px;font-size:13px}.footer-note{color:#8a9aa3;font-size:11px;text-align:center;margin-top:25px}.pill{display:inline-flex;align-items:center;gap:5px;background:#e9f4f4;color:#26766e;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:800}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.section-title h2{margin:0}.mobile-menu{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none;position:fixed;z-index:6;top:76px;bottom:0;left:0;width:250px;box-shadow:10px 0 25px #0001}.aside-open aside{display:block}.mobile-menu{display:inline-flex}.main{padding-top:24px}.choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.topbar{height:66px;padding:0 15px}.brand{font-size:13px}.brandmark{width:34px;height:34px}.top-right .user-label{display:none}.layout{min-height:calc(100vh - 66px)}aside{top:66px}.main{padding:22px 14px 45px}.card{padding:17px}.grid.two,.grid.three,.stats,.doctor-list{grid-template-columns:1fr}.choice-grid{grid-template-columns:1fr 1fr}.choice{padding:12px;min-height:125px}.choice.selected{padding:11px}.times{grid-template-columns:repeat(3,minmax(0,1fr))}.step{font-size:10px;gap:5px}.step .num{width:22px;height:22px}.pagehead{margin-bottom:20px}.pagehead h1{font-size:27px}.login-wrap{margin:2vh auto}.login-card{padding:22px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.top-right{gap:7px}}
</style>

<body>
<div class="app" id="app">
<header class="topbar"><button class="btn ghost mobile-menu" id="menuToggle" aria-label="Abrir menú">☰</button><div class="brand"><div class="brandmark">✚</div><div>CHRISTUS MUGUERZA<small>Sistema de citas médicas</small></div></div><div class="top-right" id="topRight"><span class="user-label">Portal de pacientes</span><div class="avatar">CM</div></div></header>
<div class="layout" id="layout"><aside id="sidebar"><div class="side-label">Menú principal</div><nav id="nav"></nav><div class="aside-note"><strong>Atención médica organizada</strong><br>Consulta especialidades, encuentra un profesional y solicita tu cita desde un solo lugar.</div><button class="navbtn" id="logoutBtn" style="margin-top:24px"><span>↪</span>Cerrar sesión</button></aside><main class="main" id="main"></main></div>
</div><div id="toast" class="toast hidden" role="status"></div>
<script>
/* CAPA DE DATOS: almacenamiento local de demostración. No sustituye un servidor real. */
const Store={key:'cm_demo_v1',load(){try{return JSON.parse(localStorage.getItem(this.key))||null}catch(e){return null}},save(){localStorage.setItem(this.key,JSON.stringify(state))}};
const specialties=[{id:'cardio',name:'Cardiología',icon:'♡',desc:'Corazón y sistema circulatorio'},{id:'derma',name:'Dermatología',icon:'◉',desc:'Piel, cabello y uñas'},{id:'pedi',name:'Pediatría',icon:'♧',desc:'Salud infantil'},{id:'gine',name:'Ginecología',icon:'✿',desc:'Salud de la mujer'},{id:'trauma',name:'Traumatología',icon:'⌁',desc:'Huesos y articulaciones'},{id:'general',name:'Medicina general',icon:'✚',desc:'Atención médica integral'}];
const doctors=[{id:'d1',name:'Dra. Andrea Martínez',specialty:'cardio',credential:'Cardiología · Céd. prof. demo 4821',days:[0,1,2,4]},{id:'d2',name:'Dr. Luis Hernández',specialty:'cardio',credential:'Cardiología · Céd. prof. demo 7352',days:[1,2,3,4]},{id:'d3',name:'Dra. Fernanda Ruiz',specialty:'derma',credential:'Dermatología · Céd. prof. demo 6214',days:[0,2,3,4]},{id:'d4',name:'Dr. Carlos Jiménez',specialty:'derma',credential:'Dermatología · Céd. prof. demo 9153',days:[0,1,3,4]},{id:'d5',name:'Dra. Sofía Garza',specialty:'pedi',credential:'Pediatría · Céd. prof. demo 3720',days:[0,1,2,3]},{id:'d6',name:'Dr. Miguel Torres',specialty:'pedi',credential:'Pediatría · Céd. prof. demo 8401',days:[1,2,3,4]},{id:'d7',name:'Dra. Valeria Santos',specialty:'gine',credential:'Ginecología · Céd. prof. demo 1937',days:[0,1,3,4]},{id:'d8',name:'Dr. Roberto Salas',specialty:'trauma',credential:'Traumatología · Céd. prof. demo 5520',days:[0,2,3,4]},{id:'d9',name:'Dra. Elena Flores',specialty:'general',credential:'Medicina general · Céd. prof. demo 6741',days:[0,1,2,3,4]}];
const freshState=()=>({users:[{id:'patient-demo',name:'Paciente Demo',email:'paciente@demo.com',password:'demo123',role:'patient'},{id:'doctor-demo',name:'Doctor Demo',email:'doctor@demo.com',password:'demo123',role:'doctor'}],appointments:[],notifications:[],currentUser:null,nextId:1});
let state=Store.load()||freshState();if(!state.users)state=freshState();let page='login',booking={specialty:'',doctor:'',date:'',time:''},loginMode='login',toastTimer;
const main=document.getElementById('main'),nav=document.getElementById('nav'),topRight=document.getElementById('topRight');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>state.users.find(u=>u.id===state.currentUser)||null;
const dateLabel=(s,opts={weekday:'short',day:'numeric',month:'short',year:'numeric'})=>new Date(s+'T12:00:00').toLocaleDateString('es-MX',opts);
const statusClass=s=>s==='Aprobada'?'approved':s==='Rechazada'?'rejected':'pending';
function persist(){Store.save()}
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3200)}
function setPage(p){page=p;render()}
function menuItems(){return current()?.role==='doctor'?[['doctorHome','▦','Solicitudes'],['doctorAll','☷','Agenda completa'],['notifications','♧','Notificaciones']]:[['home','⌂','Inicio'],['schedule','＋','Solicitar cita'],['appointments','▤','Mis citas'],['notifications','♧','Notificaciones']]}
function renderShell(){const u=current();document.getElementById('sidebar').classList.toggle('hidden',!u);document.getElementById('logoutBtn').classList.toggle('hidden',!u);document.getElementById('layout').style.gridTemplateColumns=u?'245px minmax(0,1fr)':'1fr';topRight.innerHTML=u?`<span class="user-label">${esc(u.name)} · ${u.role==='doctor'?'Doctor':'Paciente'}</span><div class="avatar">${esc(u.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())}</div>`:`<span class="user-label">Portal de pacientes</span><div class="avatar">CM</div>`;nav.innerHTML=menuItems().map(([id,icon,label])=>`<button class="navbtn ${page===id?'active':''}" data-page="${id}"><span>${icon}</span>${label}${id==='notifications'&&unreadCount()?`<span style="margin-left:auto;background:#2c9b91;color:white;border-radius:99px;font-size:10px;width:19px;height:19px;display:grid;place-items:center">${unreadCount()}</span>`:''}</button>`).join('');nav.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{booking={specialty:'',doctor:'',date:'',time:''};setPage(b.dataset.page);document.getElementById('layout').classList.remove('aside-open')})}
function render(){renderShell();if(!current()){document.getElementById('sidebar').classList.add('hidden');document.getElementById('layout').style.gridTemplateColumns='1fr';renderLogin();return}switch(page){case'login':case'register':page=current().role==='doctor'?'doctorHome':'home';renderShell();render();return;case'home':renderHome();break;case'schedule':renderSchedule();break;case'appointments':renderAppointments();break;case'notifications':renderNotifications();break;case'doctorHome':renderDoctor(true);break;case'doctorAll':renderDoctor(false);break;default:renderHome()}}
function renderLogin(){main.innerHTML=`<div class="login-wrap"><div class="brand login-brand"><div class="brandmark">✚</div><div>CHRISTUS MUGUERZA<small>Sistema de citas médicas</small></div></div><section class="card login-card">${loginMode==='register'?registerForm():loginForm()}</section><p class="footer-note">Portal demostrativo · Datos guardados únicamente en este navegador</p></div>`;const form=document.getElementById('authForm');if(form)form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);if(loginMode==='login'){const email=String(fd.get('email')).trim().toLowerCase(),pass=String(fd.get('password'));const u=state.users.find(x=>x.email.toLowerCase()===email&&x.password===pass);if(!u){showAuthError('El correo o la contraseña son incorrectos.');return}state.currentUser=u.id;persist();page=u.role==='doctor'?'doctorHome':'home';render()}else{const name=String(fd.get('name')).trim(),email=String(fd.get('email')).trim().toLowerCase(),pass=String(fd.get('password')),confirm=String(fd.get('confirm'));if(!name||!email||!pass||!confirm){showAuthError('Completa todos los campos obligatorios.');return}if(!/^\S+@\S+\.\S+$/.test(email)){showAuthError('Ingresa un correo electrónico válido.');return}if(pass.length<6){showAuthError('La contraseña debe tener al menos 6 caracteres.');return}if(pass!==confirm){showAuthError('Las contraseñas no coinciden.');return}if(state.users.some(x=>x.email.toLowerCase()===email)){showAuthError('Ya existe una cuenta registrada con ese correo.');return}const u={id:'u'+state.nextId++,name,email,password:pass,role:'patient'};state.users.push(u);state.currentUser=u.id;persist();page='home';render();notify('Tu cuenta se creó correctamente.')}}}
function loginForm(){return `<div class="eyebrow">Bienvenido</div><h1>Inicia sesión</h1><p>Accede para consultar especialistas y solicitar una cita médica.</p><div id="authError"></div><form id="authForm"><div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="username" required placeholder="nombre@correo.com"></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña"></div><button class="btn primary" style="width:100%;margin-top:5px">Iniciar sesión →</button></form><div class="divider"></div><p class="tiny">¿Aún no tienes cuenta? <button class="linkbtn" id="toRegister">Regístrate como paciente</button></p><div class="notice info"><strong>Accesos de demostración</strong><br>Paciente: paciente@demo.com / demo123<br>Doctor: doctor@demo.com / demo123</div>`}
function registerForm(){return `<div class="eyebrow">Nuevo paciente</div><h1>Crear cuenta</h1><p>Registra tus datos para comenzar a solicitar citas.</p><div id="authError"></div><form id="authForm"><div class="field"><label for="name">Nombre completo *</label><input id="name" name="name" required maxlength="100" autocomplete="name"></div><div class="field"><label for="email">Correo electrónico *</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Contraseña *</label><input id="password" name="password" type="password" required minlength="6" autocomplete="new-password"></div><div class="field"><label for="confirm">Confirmar contraseña *</label><input id="confirm" name="confirm" type="password" required minlength="6" autocomplete="new-password"></div><button class="btn primary" style="width:100%">Crear cuenta</button></form><p class="tiny" style="margin-top:16px">¿Ya tienes cuenta? <button class="linkbtn" id="toLogin">Iniciar sesión</button></p>`}
function showAuthError(msg){const e=document.getElementById('authError');if(e)e.innerHTML=`<div class="notice error">${esc(msg)}</div>`}
function renderHome(){const u=current(),mine=state.appointments.filter(a=>a.patientId===u.id),pending=mine.filter(a=>a.status==='Pendiente').length,approved=mine.filter(a=>a.status==='Aprobada').length;main.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Portal del paciente</div><h1>Hola, ${esc(u.name.split(' ')[0])}</h1><p>Organiza tu atención médica desde un solo lugar.</p></div><button class="btn primary" id="startBooking">＋ Solicitar cita</button></div><div class="stats"><div class="stat"><div class="label">Mis citas</div><strong>${mine.length}</strong><div class="detail">Solicitudes registradas</div></div><div class="stat"><div class="label">Pendientes</div><strong>${pending}</strong><div class="detail">Esperando respuesta del doctor</div></div><div class="stat"><div class="label">Aprobadas</div><strong>${approved}</strong><div class="detail">Citas confirmadas</div></div></div><div class="grid two"><section class="card"><div class="eyebrow">Comienza aquí</div><h2>Agenda una consulta</h2><p class="subtext">Selecciona una especialidad, encuentra un profesional y elige un horario disponible.</p><button class="btn primary" id="bookNow">Buscar especialistas →</button></section><section class="card"><div class="eyebrow">Acceso rápido</div><h2>Consulta tus solicitudes</h2><p class="subtext">Revisa el estado de tus citas y las notificaciones de aprobación o rechazo.</p><button class="btn secondary" id="viewAppointments">Ver mis citas</button></section></div><section class="card"><div class="section-title"><h2>Próximas citas y solicitudes</h2><button class="linkbtn" id="allAppointments">Ver todas</button></div>${appointmentTable(mine.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,4),false)}</section><p class="tiny">Demostración académica. La información se guarda localmente en este navegador; no se envían solicitudes reales a Christus Muguerza.</p>`;document.getElementById('startBooking').onclick=()=>setPage('schedule');document.getElementById('bookNow').onclick=()=>setPage('schedule');document.getElementById('viewAppointments').onclick=()=>setPage('appointments');document.getElementById('allAppointments').onclick=()=>setPage('appointments')}
function renderSchedule(){booking.specialty=booking.specialty||'';const sp=specialties.find(s=>s.id===booking.specialty),doc=doctors.find(d=>d.id===booking.doctor),myAppts=state.appointments;const futureDates=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i+1);return d.toISOString().slice(0,10)}).filter(s=>new Date(s+'T12:00:00').getDay()!==0&&new Date(s+'T12:00:00').getDay()!==6);main.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Nueva solicitud</div><h1>Programación de citas</h1><p>Selecciona la atención que necesitas y encuentra un horario disponible.</p></div><span class="pill">● Paso ${!sp?1:!doc?2:!booking.time?3:4} de 4</span></div><div class="card"><div class="stepper"><div class="step ${!sp?'active':'done'}"><span class="num">1</span>Especialidad</div><div class="step ${sp&&!doc?'active':doc?'done':''}"><span class="num">2</span>Doctor</div><div class="step ${doc&&!booking.time?'active':booking.time?'done':''}"><span class="num">3</span>Horario</div><div class="step ${booking.time?'active':''}"><span class="num">4</span>Confirmación</div></div><section><h2>1. Selecciona una especialidad</h2><p class="subtext">Elige el área médica para mostrar los profesionales correspondientes.</p><div class="choice-grid">${specialties.map(s=>`<button class="choice ${booking.specialty===s.id?'selected':''}" data-specialty="${s.id}"><div class="choice-icon">${s.icon}</div><strong>${s.name}</strong><small>${s.desc}</small></button>`).join('')}</div></section><div class="divider"></div><section><h2>2. Selecciona un doctor</h2><p class="subtext">${sp?'Profesionales de '+esc(sp.name):'Primero selecciona una especialidad médica.'}</p>${sp?`<div class="doctor-list">${doctors.filter(d=>d.specialty===sp.id).map(d=>`<button class="doctor ${booking.doctor===d.id?'selected':''}" data-doctor="${d.id}"><span class="docavatar">${d.name.split(' ').filter(x=>x.length>2).slice(0,2).map(x=>x[0]).join('')}</span><span><strong>${esc(d.name)}</strong><small>${esc(d.credential)}</small><small>Consulta presencial · Christus Muguerza</small></span></button>`).join('')}</div>`:`<div class="notice info">Selecciona una especialidad para consultar los doctores disponibles.</div>`}</section><div class="divider"></div><section><h2>3. Elige fecha y horario</h2><p class="subtext">Se muestran horarios de demostración para los próximos días hábiles. Los horarios ocupados no pueden seleccionarse.</p>${doc?`<div class="dates">${futureDates.map(d=>`<button class="datebtn ${booking.date===d?'selected':''}" data-date="${d}"><small>${dateLabel(d,{weekday:'short'}).replace('.','')}</small><strong>${dateLabel(d,{day:'numeric',month:'short'}).replace('.','')}</strong></button>`).join('')}</div>${booking.date?`<div class="times">${['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','15:00','15:30','16:00','16:30'].map(t=>{const busy=myAppts.some(a=>a.doctorId===doc.id&&a.date===booking.date&&a.time===t&&a.status!=='Rechazada');return `<button class="timebtn ${booking.time===t?'selected':''}" data-time="${t}" ${busy?'disabled':''}>${t}${busy?' · Ocupado':''}</button>`}).join('')}</div>`:`<div class="notice info">Selecciona una fecha para ver los horarios.</div>`}`:`<div class="notice info">Selecciona un doctor para consultar las fechas y horarios.</div>`}</section>${booking.time?`<div class="divider"></div><section><h2>4. Confirma tu solicitud</h2><div class="summary"><div><strong>Especialidad:</strong> ${esc(sp?.name)}</div><div><strong>Doctor:</strong> ${esc(doc?.name)}</div><div><strong>Fecha:</strong> ${dateLabel(booking.date)}</div><div><strong>Hora:</strong> ${booking.time}</div><div><strong>Estado inicial:</strong> Pendiente de aprobación</div></div><div class="notice warn">La cita quedará como pendiente hasta que el doctor apruebe o rechace la solicitud.</div><div class="btnrow"><button class="btn primary" id="confirmBooking">Confirmar solicitud →</button><button class="btn ghost" id="resetBooking">Cancelar selección</button></div></section>`:''}</div><p class="tiny">Las consultas de especialidades, doctores y horarios son parte del prototipo. Los datos y disponibilidad son simulados.</p>`;
main.querySelectorAll('[data-specialty]').forEach(b=>b.onclick=()=>{booking={specialty:b.dataset.specialty,doctor:'',date:'',time:''};renderSchedule()});main.querySelectorAll('[data-doctor]').forEach(b=>b.onclick=()=>{booking.doctor=b.dataset.doctor;booking.date='';booking.time='';renderSchedule()});main.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{booking.date=b.dataset.date;booking.time='';renderSchedule()});main.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{booking.time=b.dataset.time;renderSchedule()});const confirm=document.getElementById('confirmBooking');if(confirm)confirm.onclick=()=>{if(!booking.specialty||!booking.doctor||!booking.date||!booking.time){notify('Completa todos los pasos antes de confirmar.');return}if(state.appointments.some(a=>a.doctorId===booking.doctor&&a.date===booking.date&&a.time===booking.time&&a.status!=='Rechazada')){notify('Ese horario ya no está disponible. Selecciona otro.');booking.time='';renderSchedule();return}const u=current(),a={id:'CIT-'+String(state.nextId++).padStart(4,'0'),patientId:u.id,patientName:u.name,patientEmail:u.email,doctorId:booking.doctor,doctorName:doc.name,specialty:sp.name,specialtyId:sp.id,date:booking.date,time:booking.time,status:'Pendiente',createdAt:Date.now()};state.appointments.push(a);state.notifications.push({id:'N'+state.nextId++,userId:u.id,title:'Solicitud registrada',message:`Tu solicitud con ${a.doctorName} para el ${dateLabel(a.date)} a las ${a.time} quedó pendiente de aprobación.`,date:Date.now(),read:false,appointmentId:a.id});persist();booking={specialty:'',doctor:'',date:'',time:''};setPage('appointments');notify('Solicitud registrada con estado Pendiente.')};const reset=document.getElementById('resetBooking');if(reset)reset.onclick=()=>{booking={specialty:'',doctor:'',date:'',time:''};renderSchedule()}}
function appointmentTable(list,actions=true){if(!list.length)return `<div class="empty"><div class="symbol">▤</div><strong>No hay citas registradas</strong><p>Cuando solicites una cita, aparecerá aquí.</p></div>`;return `<div class="tablewrap"><table><thead><tr><th>Especialidad / doctor</th><th>Fecha y hora</th><th>Estado</th>${actions?'<th>Acciones</th>':''}</tr></thead><tbody>${list.map(a=>`<tr><td><strong>${esc(a.specialty)}</strong><br><span class="tiny">${esc(a.doctorName)}</span><br><span class="tiny">${esc(a.id)}</span></td><td>${dateLabel(a.date)}<br><span class="tiny">${esc(a.time)} h</span></td><td><span class="status ${statusClass(a.status)}">${esc(a.status)}</span></td>${actions?`<td>${a.status==='Pendiente'&&current()?.role==='doctor'?`<div class="btnrow"><button class="btn success" data-approve="${a.id}">Aprobar</button><button class="btn danger" data-reject="${a.id}">Rechazar</button></div>`:'<span class="tiny">—</span>'}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function renderAppointments(){const u=current(),list=state.appointments.filter(a=>a.patientId===u.id).sort((a,b)=>b.createdAt-a.createdAt);main.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Portal del paciente</div><h1>Mis citas</h1><p>Consulta el estado actualizado de tus solicitudes médicas.</p></div><button class="btn primary" id="newAppt">＋ Solicitar cita</button></div><section class="card"><div class="section-title"><h2>Historial de solicitudes</h2><span class="pill">${list.length} registros</span></div>${appointmentTable(list,false)}</section><div class="notice info">Las citas nuevas se registran como <strong>Pendiente</strong>. El estado cambia cuando el doctor responde a la solicitud.</div>`;document.getElementById('newAppt').onclick=()=>setPage('schedule')}
function unreadCount(){const u=current();return u?state.notifications.filter(n=>n.userId===u.id&&!n.read).length:0}
function renderNotifications(){const u=current(),list=state.notifications.filter(n=>n.userId===u.id).sort((a,b)=>b.date-a.date);main.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Centro de avisos</div><h1>Notificaciones</h1><p>Actualizaciones relacionadas con tus solicitudes de citas.</p></div>${list.some(n=>!n.read)?'<button class="btn ghost" id="markRead">Marcar todas como leídas</button>':''}</div><section class="card">${list.length?list.map(n=>`<article style="padding:15px 0;border-bottom:1px solid var(--line);display:flex;gap:13px"><div style="width:38px;height:38px;flex-shrink:0;border-radius:12px;background:${n.read?'#edf2f5':'#e2f4f0'};display:grid;place-items:center;color:var(--navy)">♧</div><div style="flex:1"><div class="section-title" style="margin-bottom:5px"><strong style="font-size:14px;color:var(--navy)">${esc(n.title)}</strong>${n.read?'<span class="status read">Leída</span>':'<span class="status approved">Nueva</span>'}</div><p style="margin:0 0 7px;font-size:13px;line-height:1.6;color:#526a78">${esc(n.message)}</p><span class="tiny">${new Date(n.date).toLocaleString('es-MX')}</span></div></article>`).join(''):`<div class="empty"><div class="symbol">♧</div><strong>No tienes notificaciones</strong><p>Aquí aparecerán los avisos sobre tus citas.</p></div>`}</section><p class="tiny">En esta versión de demostración, las notificaciones se generan dentro del navegador. No se envían correos electrónicos reales.</p>`;const mark=document.getElementById('markRead');if(mark)mark.onclick=()=>{list.forEach(n=>n.read=true);persist();render()};list.filter(n=>!n.read).forEach(n=>n.read=true);if(list.some(n=>!n.read)){persist()}}
function renderDoctor(pendingOnly){const u=current(),list=state.appointments.filter(a=>!pendingOnly||a.status==='Pendiente').sort((a,b)=>b.createdAt-a.createdAt);main.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Portal del profesional</div><h1>${pendingOnly?'Solicitudes pendientes':'Agenda de citas'}</h1><p>${pendingOnly?'Revisa las solicitudes y aprueba o rechaza las citas médicas.':'Consulta todas las solicitudes registradas en este prototipo.'}</p></div></div><div class="stats"><div class="stat"><div class="label">Pendientes</div><strong>${state.appointments.filter(a=>a.status==='Pendiente').length}</strong><div class="detail">Requieren atención</div></div><div class="stat"><div class="label">Aprobadas</div><strong>${state.appointments.filter(a=>a.status==='Aprobada').length}</strong><div class="detail">Citas confirmadas</div></div><div class="stat"><div class="label">Rechazadas</div><strong>${state.appointments.filter(a=>a.status==='Rechazada').length}</strong><div class="detail">Solicitudes no aprobadas</div></div></div><section class="card"><div class="section-title"><h2>${pendingOnly?'Solicitudes por revisar':'Todas las solicitudes'}</h2><span class="pill">${list.length} registros</span></div>${list.length?`<div class="tablewrap"><table><thead><tr><th>Paciente</th><th>Consulta</th><th>Fecha y hora</th><th>Estado</th><th>Decisión</th></tr></thead><tbody>${list.map(a=>`<tr><td><strong>${esc(a.patientName)}</strong><br><span class="tiny">${esc(a.patientEmail)}</span></td><td>${esc(a.specialty)}<br><span class="tiny">${esc(a.doctorName)}</span></td><td>${dateLabel(a.date)}<br><span class="tiny">${esc(a.time)} h</span></td><td><span class="status ${statusClass(a.status)}">${esc(a.status)}</span></td><td>${a.status==='Pendiente'?`<div class="btnrow"><button class="btn success" data-approve="${a.id}">Aprobar</button><button class="btn danger" data-reject="${a.id}">Rechazar</button></div>`:'<span class="tiny">Ya atendida</span>'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="symbol">✓</div><strong>No hay solicitudes ${pendingOnly?'pendientes':''}</strong><p>Las solicitudes de citas aparecerán aquí.</p></div>`}</section><p class="tiny">El perfil de doctor es de demostración. Los cambios de estado son locales y no representan una aprobación médica real.</p>`;main.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>changeStatus(b.dataset.approve,'Aprobada'));main.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>changeStatus(b.dataset.reject,'Rechazada'))}
function changeStatus(id,status){const a=state.appointments.find(x=>x.id===id);if(!a||a.status!=='Pendiente')return;a.status=status;state.notifications.push({id:'N'+state.nextId++,userId:a.patientId,title:status==='Aprobada'?'Cita aprobada':'Solicitud rechazada',message:status==='Aprobada'?`Tu cita con ${a.doctorName} para el ${dateLabel(a.date)} a las ${a.time} fue aprobada.`:`Tu solicitud con ${a.doctorName} para el ${dateLabel(a.date)} a las ${a.time} fue rechazada.`,date:Date.now(),read:false,appointmentId:a.id});persist();render();notify(`La solicitud ${a.id} fue marcada como ${status.toLowerCase()}.`)}
document.getElementById('logoutBtn').onclick=()=>{state.currentUser=null;persist();page='login';loginMode='login';render()};document.getElementById('menuToggle').onclick=()=>document.getElementById('layout').classList.toggle('aside-open');document.addEventListener('click',e=>{if(e.target.id==='toRegister'){loginMode='register';renderLogin()}if(e.target.id==='toLogin'){loginMode='login';renderLogin()}});

if(current())page=current().role==='doctor'?'doctorHome':'home';else page='login';render();
